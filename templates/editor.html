
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambert CS editor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="layout">

        <section class="problem-panel">
            <div class="panel-header"><span>Problem</span><a href="{{ url_for('pages.index') }}">Assessments</a></div>

            <div class="problem-content">
                {{ problem_html | safe }}
            </div>
        </section>

        <section class="right-panel">

            <div class="editor-panel">

                <div class="panel-header">
                    <span>Editor</span>

                    <div class="controls">
                        <select id="language" aria-label="Programming language">
                            {% for key, language in languages.items() %}
                            <option value="{{ key }}">{{ language.label }}</option>
                            {% endfor %}
                        </select>

                        <button id="run-button" disabled>Run</button>
                        <button id="reset-button" disabled>Reset</button>
                    </div>
                </div>

                <div id="editor"></div>

            </div>

            <div class="terminal-panel">
                <div class="panel-header">Terminal</div>

                <pre id="output">Code output will be here!</pre>
            </div>

        </section>

    </div>

    <script id="editor-config" type="application/json">{{ editor_config | tojson }}</script>
    <script src="{{ monaco_base }}vs/loader.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
