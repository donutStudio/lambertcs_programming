<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ assessment.title }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"></head>
<body class="assessment-page"><header class="test-header">
<a class="exit-link" href="/" id="exit-assessment">← Assessments</a><div class="assessment-name">{{ assessment.title }}</div>
<nav id="question-nav" aria-label="Question navigation"><select id="question-select" aria-label="Navigate to question"></select></nav>
<div class="header-right"><span id="save-status" role="status"></span><span id="score-display" hidden></span><span id="timer">No Time Limit</span><button id="submit-assessment" class="submit-button">Submit</button></div>
</header><main id="question-host" class="question-host"></main>
<div id="complete-dialog" class="modal-backdrop" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="complete-title"><h2 id="complete-title">Assessment submitted</h2><p id="complete-message"></p><button id="complete-home">Return to assessments</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
<script id="assessment-config" type="application/json">{{ config|tojson }}</script><script src="{{ monaco_base }}vs/loader.js"></script><script src="{{ url_for('static',filename='assessment.js') }}"></script></body></html>
