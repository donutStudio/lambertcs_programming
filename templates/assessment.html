<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ assessment.title }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="assessment-page"><header class="test-header">
  <a class="exit-link" href="/" id="exit-assessment" aria-label="Exit assessment">← Exit</a><div class="assessment-name">{{ assessment.title }}</div>
  <div class="header-right"><span id="score-display" class="score-display" hidden></span><span id="timer" class="timer">Untimed</span><button id="submit-assessment" class="submit-button">Submit</button></div>
</header><nav class="question-nav" id="question-nav" aria-label="Question navigation"></nav>
<main id="question-host" class="question-host"></main><div id="toast" role="status" aria-live="polite"></div>
<div id="complete-dialog" class="modal-backdrop" hidden><section class="modal-card" role="dialog" aria-modal="true"><h2 id="complete-title">Assessment submitted</h2><p id="complete-message"></p><button id="complete-home" class="button">Return to assessments</button></section></div>
<script id="assessment-config" type="application/json">{{ config|tojson }}</script><script src="{{ monaco_base }}vs/loader.js"></script><script src="{{ url_for('static',filename='assessment.js') }}"></script></body></html>
